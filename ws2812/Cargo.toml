[package]
name = "ws2812"
version = "0.1.0"
edition = "2024"
description = "no_std SPI waveform driver for Worldsemi WS2812B-2020 LEDs"

[dependencies]
defmt = { version = "1.2.0", optional = true }
embedded-hal = "1.0.0"
embedded-hal-async = { version = "1.0.0", optional = true }

[features]
default = []
async = ["dep:embedded-hal-async"]
defmt = ["dep:defmt"]
