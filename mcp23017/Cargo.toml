[package]
name = "mcp23017"
version = "0.1.0"
edition = "2024"
description = "Typed no_std embedded-hal driver for the MCP23017 and MCP23S17"
license = "MIT OR Apache-2.0"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies]
bilge = "0.5.0"
defmt = { version = "1.2.0", optional = true }
embedded-hal = "1.0.0"
typed-builder = "0.23.2"

[dev-dependencies]
defmt = { version = "1.2.0", features = ["unstable-test"] }
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }
