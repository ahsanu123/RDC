[package]
name = "mmc5983ma"
version = "0.1.0"
edition = "2024"
description = "no_std embedded-hal I2C and SPI driver for the MEMSIC MMC5983MA"
license = "MIT"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies]
bilge = "0.5.0"
defmt = { version = "1.2.0", optional = true }
embedded-hal = "1.0.0"
typed-builder = "0.23.2"

[dev-dependencies]
embedded-hal-mock = { version = "0.11.1", features = ["eh1"] }
