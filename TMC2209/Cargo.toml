[package]
name = "tmc2209"
version = "0.1.0"
edition = "2024"
authors = ["Ahsanu Amala"]
repository = "https://github.com/ahsanu123/RDC/TMC2209"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["tmc2209", "stepper", "embedded-hal"]
categories = ["embedded", "hardware-support", "no-std"]
homepage = "https://github.com/ahsanu123/RDC/tree/main/TMC2209"
description = "Typed no_std UART driver for the TMC2209 stepper motor controller"

[features]
default = []
defmt = ["dep:defmt"]

[dependencies]
bilge = "0.5.0"
defmt = { version = "1.2.0", optional = true }
embedded-hal = "1.0.0"
embedded-hal-nb = "1.0.0"
nb = "1.1.0"
typed-builder = "0.23.2"

[dev-dependencies]
defmt = { version = "1.2.0", features = ["unstable-test"] }
embedded-hal-mock = { version = "0.11.1", default-features = false, features = ["eh1"] }

[[bin]]
name = "tmc2209_main"
path = "src/bin/tmc2209.rs"
